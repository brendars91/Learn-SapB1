name: production-smoke

on:
  workflow_run:
    workflows: ["verify-and-build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Wait for deployment
        run: |
          echo "Waiting 60s for GitHub Pages deployment to complete..."
          sleep 60
      - name: Run production smoke test
        run: node test/browser-production-smoke.mjs
