name: verify-and-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic locale patch
        run: node scripts/enforce-strict-locale.mjs
      - name: Run tests
        run: npm test
      - name: Build standalone and Pages index
        run: npm run build
      - name: Ensure generated artifacts are synchronized
        run: |
          cmp index.html dist/SAP-Business-One-Mastery-Lab-Standalone.html
          test -s dist/sap-b1-mastery-lab.html
      - name: Commit generated source and artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.mjs index.html dist/SAP-Business-One-Mastery-Lab-Standalone.html dist/sap-b1-mastery-lab.html
          git commit -m "build: synchronize localized app artifacts"
          git push