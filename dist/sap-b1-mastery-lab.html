<section id="sap-b1-mastery-lab" aria-label="SAP Business One mastery lab">
  <div data-app-shell aria-live="polite"></div>
</section>
<style>
/* ============================================================
   Learn-SapB1 — "The living ledger"
   Visual thesis: a bound accounting ledger brought to life.
   Cream paper, editorial serif, hairline rules, one oxblood accent.
   ============================================================ */
#sap-b1-mastery-lab {
  --paper: #f7f2e7;
  --paper-deep: #efe7d5;
  --paper-edge: #e2d8c2;
  --ink: #1f1a13;
  --ink-soft: #4a4235;
  --ink-faint: #7a6f5d;
  --rule: #c9bda3;
  --rule-strong: #8f8265;
  --accent: #7c2d2d;
  --accent-ink: #fdf9f0;
  --good: #2e5e3a;
  --bad: #8a2f2f;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --mono: 'SF Mono', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace;

  /* locked type scale (ratio ~1.25) */
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.25rem;
  --step-2: 1.5625rem;
  --step-3: 1.953rem;
  --step-4: 2.441rem;

  /* locked spacing scale (×4) */
  --s1: 0.25rem; --s2: 0.5rem; --s3: 0.75rem; --s4: 1rem;
  --s6: 1.5rem; --s8: 2rem; --s12: 3rem; --s16: 4rem;

  color: var(--ink);
  background: var(--paper);
  font-family: var(--serif);
  font-size: var(--step-0);
  line-height: 1.55;
  width: 100%;
  padding: clamp(0.75rem, 2vw, 2rem);
  border-radius: 0;                     /* editorial: sharp */
}

/* every surface: flat paper, hairline rule, sharp corners */
#sap-b1-mastery-lab .card,
#sap-b1-mastery-lab .viz-stat {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  box-shadow: 0 1px 0 var(--paper-edge);
}

/* layout */
#sap-b1-mastery-lab .sbl-stack { display: grid; gap: var(--s4); }
#sap-b1-mastery-lab .sbl-topline,
#sap-b1-mastery-lab .sbl-nav,
#sap-b1-mastery-lab .sbl-toolbar,
#sap-b1-mastery-lab .sbl-actions,
#sap-b1-mastery-lab .sbl-process { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
#sap-b1-mastery-lab .sbl-topline { justify-content: space-between; }
#sap-b1-mastery-lab .sbl-statusline { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
#sap-b1-mastery-lab .sbl-nav {
  padding-block: var(--s2) var(--s3);
  border-top: 3px double var(--rule-strong);
  border-bottom: 3px double var(--rule-strong);
}
#sap-b1-mastery-lab .sbl-main { display: grid; gap: var(--s6); }

/* typography: the serif does hierarchy by weight+color, not size alone */
#sap-b1-mastery-lab h1 { font-size: var(--step-4); font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; }
#sap-b1-mastery-lab h2 { font-size: var(--step-2); font-weight: 700; letter-spacing: -0.01em; }
#sap-b1-mastery-lab h3 { font-size: var(--step-1); font-weight: 600; }
#sap-b1-mastery-lab h4 {
  font-size: var(--step--1);
  font-family: var(--mono);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
}
#sap-b1-mastery-lab p { margin: 0; max-width: 70ch; }
#sap-b1-mastery-lab .text-muted { color: var(--ink-faint); }
#sap-b1-mastery-lab .text-small { font-size: var(--step--1); }
#sap-b1-mastery-lab .text-nowrap { white-space: nowrap; }

/* numbers are mono — every figure, score, ID */
#sap-b1-mastery-lab .viz-badge,
#sap-b1-mastery-lab .viz-stat-value,
#sap-b1-mastery-lab .sbl-num {
  font-family: var(--mono);
  font-size: 0.85em;
  letter-spacing: -0.01em;
}
#sap-b1-mastery-lab .viz-badge {
  display: inline-block;
  padding: 0.1em 0.5em;
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  background: var(--paper-deep);
  color: var(--ink-soft);
  font-weight: 600;
}
#sap-b1-mastery-lab .sbl-card-head .viz-badge { font-size: 0.72rem; }

/* controls — editorial buttons: sharp, ruled, one accent */
#sap-b1-mastery-lab .btn,
#sap-b1-mastery-lab a.btn {
  appearance: none;
  font-family: var(--serif);
  font-size: var(--step--1);
  font-weight: 600;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: var(--s2) var(--s4);
  cursor: pointer;
  text-decoration: none;
  transition: background 160ms ease-out, color 160ms ease-out, box-shadow 160ms ease-out;
}
#sap-b1-mastery-lab .btn:hover { background: var(--paper-deep); box-shadow: 2px 2px 0 var(--rule-strong); }
#sap-b1-mastery-lab .btn:active { transform: translate(1px, 1px); box-shadow: none; }
#sap-b1-mastery-lab .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
#sap-b1-mastery-lab .btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
#sap-b1-mastery-lab .btn-primary:hover { background: #6b2525; box-shadow: 2px 2px 0 var(--rule-strong); }
#sap-b1-mastery-lab .btn:focus-visible,
#sap-b1-mastery-lab .form-select:focus-visible,
#sap-b1-mastery-lab .form-control:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
#sap-b1-mastery-lab .btn-ghost { border-color: var(--rule-strong); color: var(--ink-soft); }

/* nav buttons read as chapter tabs */
#sap-b1-mastery-lab .sbl-nav .btn { border-color: transparent; border-bottom: 2px solid transparent; padding: var(--s1) var(--s2); }
#sap-b1-mastery-lab .sbl-nav .btn:hover { background: transparent; box-shadow: none; border-bottom-color: var(--rule-strong); }
#sap-b1-mastery-lab .sbl-nav .btn[aria-current="true"] { border-bottom-color: var(--accent); color: var(--accent); }

/* forms */
#sap-b1-mastery-lab .form-label { display: inline-grid; gap: var(--s1); font-size: var(--step--1); color: var(--ink-soft); }
#sap-b1-mastery-lab .form-select,
#sap-b1-mastery-lab .form-control {
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  padding: var(--s2) var(--s3);
  font-family: var(--serif);
  font-size: var(--step--1);
}

/* progress — a ruled ledger line filling with ink */
#sap-b1-mastery-lab .sbl-progress-track {
  height: 0.5rem;
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  background: repeating-linear-gradient(90deg, transparent 0 7px, var(--paper-deep) 7px 8px);
}
#sap-b1-mastery-lab .sbl-progress-fill { height: 100%; background: var(--accent); transition: width 240ms ease-out; }

/* lists and grids */
#sap-b1-mastery-lab .sbl-choice-list,
#sap-b1-mastery-lab .sbl-detail-grid,
#sap-b1-mastery-lab .sbl-levels,
#sap-b1-mastery-lab .sbl-review-list { display: grid; gap: var(--s3); }
#sap-b1-mastery-lab .sbl-choice-list { grid-template-columns: 1fr; }
#sap-b1-mastery-lab .sbl-detail-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); }
#sap-b1-mastery-lab .sbl-detail-grid section {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: var(--s3) var(--s4);
}
#sap-b1-mastery-lab .sbl-level-group { display: grid; gap: var(--s2); padding-block: var(--s3); border-bottom: 1px solid var(--rule); }
#sap-b1-mastery-lab .sbl-level-heading,
#sap-b1-mastery-lab .sbl-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }

/* skill nodes in the map — index entries of a book */
#sap-b1-mastery-lab .sbl-node {
  min-height: 4rem;
  text-align: start;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: var(--s2) var(--s3);
  cursor: pointer;
  font-family: var(--serif);
  transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
}
#sap-b1-mastery-lab .sbl-node:hover { border-color: var(--ink-soft); box-shadow: 2px 2px 0 var(--paper-edge); }
#sap-b1-mastery-lab .sbl-node.is-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#sap-b1-mastery-lab .sbl-node-meta { display: block; margin-top: var(--s1); color: var(--ink-faint); font-size: var(--step--1); font-family: var(--mono); }

/* mindset — the golden sentence becomes a pull-quote */
#sap-b1-mastery-lab .sbl-mindset {
  font-size: var(--step-1);
  font-weight: 600;
  font-style: italic;
  color: var(--ink);
  padding: var(--s3) var(--s4);
  border-left: 3px solid var(--accent);
  background: var(--paper-deep);
}
#sap-b1-mastery-lab .sbl-tips ul { margin: var(--s1) 0 0; padding-left: 1.2rem; display: grid; gap: var(--s2); }
#sap-b1-mastery-lab .sbl-tips li::marker { color: var(--accent); }
#sap-b1-mastery-lab .sbl-pitfall {
  padding: var(--s3) var(--s4);
  border: 1px solid var(--bad);
  background: #f6ece7;
}
#sap-b1-mastery-lab .sbl-pitfall h4 { color: var(--bad); }

/* verification checklist — ruled with mono boxes */
#sap-b1-mastery-lab .sbl-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
#sap-b1-mastery-lab .sbl-steps li {
  display: grid;
  grid-template-columns: 1.6rem 1fr;
  gap: var(--s2);
  align-items: baseline;
  padding-block: var(--s1);
  border-bottom: 1px dotted var(--rule);
}
#sap-b1-mastery-lab .sbl-steps li::before {
  content: counter(list-item);
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--accent);
  text-align: center;
  border: 1px solid var(--rule-strong);
  background: var(--paper-deep);
  padding: 0.05em 0.3em;
}

/* senior reasoning — numbered margin notes */
#sap-b1-mastery-lab .sbl-senior .sbl-steps li::before { border-color: var(--accent); color: var(--accent); }

/* distractor analysis — the red pen of an auditor */
#sap-b1-mastery-lab .sbl-distractors { display: grid; gap: var(--s2); }
#sap-b1-mastery-lab .sbl-distractors li {
  list-style: none;
  padding: var(--s2) var(--s3);
  border-left: 2px solid var(--bad);
  background: var(--paper);
  color: var(--ink-soft);
}
#sap-b1-mastery-lab .sbl-distractors li strong { color: var(--bad); }

/* answer feedback */
#sap-b1-mastery-lab .sbl-answer-feedback { padding: var(--s3) var(--s4); border: 1px solid var(--rule-strong); }
#sap-b1-mastery-lab .sbl-answer-feedback[data-correct="true"] { border-color: var(--good); background: #eef2ea; }
#sap-b1-mastery-lab .sbl-answer-feedback[data-correct="false"] { border-color: var(--bad); background: #f6ece7; }

/* diagrams — ink on paper, no glow */
#sap-b1-mastery-lab .sbl-diagram { background: var(--paper); border: 1px solid var(--rule); padding: var(--s3); }
#sap-b1-mastery-lab .sbl-diagram svg { width: 100%; height: auto; display: block; }
#sap-b1-mastery-lab .sbl-diagram svg text { font-family: var(--mono); }
#sap-b1-mastery-lab .sbl-diagram .viz-caption { font-size: var(--step--1); color: var(--ink-faint); font-style: italic; padding-top: var(--s2); }

/* radar + heatmap — inked figures */
#sap-b1-mastery-lab .sbl-radar { background: var(--paper); border: 1px solid var(--rule); padding: var(--s3); }
#sap-b1-mastery-lab .sbl-heatmap { display: grid; gap: var(--s1); }
#sap-b1-mastery-lab .sbl-heatcell { border: 1px solid var(--rule); background: var(--paper-deep); }

/* evidence / sources — footnote apparatus */
#sap-b1-mastery-lab .sbl-evidence { font-size: var(--step--1); }
#sap-b1-mastery-lab .sbl-evidence li { padding-block: var(--s1); border-bottom: 1px dotted var(--rule); }

/* tables — true ledger tables */
#sap-b1-mastery-lab .table-responsive { overflow-x: auto; }
#sap-b1-mastery-lab .table { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
#sap-b1-mastery-lab .table th {
  text-align: start;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  border-top: 2px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}
#sap-b1-mastery-lab .table td { padding: var(--s2) var(--s2); border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
#sap-b1-mastery-lab .table td.num, #sap-b1-mastery-lab .table th.num { text-align: end; font-family: var(--mono); }

/* home cover — editorial frontispiece */
#sap-b1-mastery-lab .sbl-cover {
  display: grid;
  gap: var(--s4);
  padding: var(--s8) var(--s4) var(--s6);
  border: 1px solid var(--rule-strong);
  outline: 1px solid var(--rule);
  outline-offset: 4px;
  text-align: center;
  background: var(--paper);
}
#sap-b1-mastery-lab .sbl-cover .sbl-kicker { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint); }
#sap-b1-mastery-lab .sbl-cover h1 { margin: 0; }
#sap-b1-mastery-lab .sbl-cover .sbl-sub { font-style: italic; color: var(--ink-soft); max-width: 52ch; margin-inline: auto; }
#sap-b1-mastery-lab .sbl-cover .sbl-rule-orn { color: var(--accent); font-size: var(--step-1); letter-spacing: 0.5em; }

/* path chips — the exact screen route */
#sap-b1-mastery-lab .sbl-path { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1); font-family: var(--mono); font-size: 0.78rem; }
#sap-b1-mastery-lab .sbl-path .crumb {
  padding: 0.15em 0.55em;
  border: 1px solid var(--rule-strong);
  background: var(--paper-deep);
  color: var(--ink-soft);
}
#sap-b1-mastery-lab .sbl-path .sep { color: var(--accent); font-weight: 700; }

/* worked example — the "show me the numbers" block */
#sap-b1-mastery-lab .sbl-example {
  border: 1px solid var(--rule-strong);
  background: var(--paper-deep);
  padding: var(--s3) var(--s4);
}
#sap-b1-mastery-lab .sbl-example .sbl-figure { font-family: var(--mono); font-variant-numeric: tabular-nums; }
#sap-b1-mastery-lab .sbl-example .sbl-taccount { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: var(--step--1); margin-block: var(--s2); }
#sap-b1-mastery-lab .sbl-example .sbl-taccount th { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); text-align: start; padding: var(--s1) var(--s2); }
#sap-b1-mastery-lab .sbl-example .sbl-taccount td { padding: 0.2rem var(--s2); border-bottom: 1px dotted var(--rule); }

/* anchor — the analogy that sticks */
#sap-b1-mastery-lab .sbl-anchor {
  display: grid;
  grid-template-columns: 2.2rem 1fr;
  gap: var(--s2);
  align-items: start;
  padding: var(--s3);
  border: 1px dotted var(--rule-strong);
}
#sap-b1-mastery-lab .sbl-anchor .glyph { font-size: var(--step-2); line-height: 1; text-align: center; color: var(--accent); }
#sap-b1-mastery-lab .sbl-anchor em { font-weight: 600; }

/* drill — numeric practice */
#sap-b1-mastery-lab .sbl-drill { display: grid; gap: var(--s3); }
#sap-b1-mastery-lab .sbl-drill-input { font-family: var(--mono); font-size: var(--step-1); padding: var(--s2); border: 1px solid var(--ink); background: var(--paper); width: min(14rem, 100%); }

/* footer of the app */
#sap-b1-mastery-lab .sbl-foot { margin-top: var(--s8); padding-top: var(--s3); border-top: 3px double var(--rule-strong); font-size: var(--step--1); color: var(--ink-faint); }

/* utility */
#sap-b1-mastery-lab .viz-controls { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: end; }
#sap-b1-mastery-lab .viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: var(--s3); }
#sap-b1-mastery-lab .viz-stat { display: grid; gap: var(--s1); padding: var(--s3) var(--s4); }
#sap-b1-mastery-lab .viz-stat-value { font-size: var(--step-3); font-weight: 700; color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
#sap-b1-mastery-lab .viz-tile { text-align: start; }

/* a11y: reduced motion */
@media (prefers-reduced-motion: reduce) {
  #sap-b1-mastery-lab * { transition: none !important; animation: none !important; }
}

/* the page shell around the app matches the paper */

/* ============ Masterclass layer ============ */
.sbl-masterclass {
  border-top: 3px double var(--ink);
  padding-top: .8rem;
  grid-column: 1 / -1;
}
.mc-title { font-size: 1.05rem; margin: 0 0 .6rem; letter-spacing: .3px; }
.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: .8rem 0; }
@media (max-width: 720px) { .mc-grid { grid-template-columns: 1fr; } }
.mc-block { background: rgba(255,255,255,.5); border: 1px solid var(--line); padding: .7rem .9rem; }
.mc-block h4 { margin: 0 0 .4rem; font-size: .82rem; text-transform: uppercase; letter-spacing: .5px; }
.mc-block ul, .mc-block ol { margin: 0; padding-left: 1.1rem; }
.mc-block li { margin: .3rem 0; font-size: .92rem; line-height: 1.45; }
.mc-bp { border-left: 3px solid var(--accent); }
.sbl-war {
  border: 1px solid var(--accent); background: rgba(124,45,45,.05);
  padding: .7rem .9rem; margin: .8rem 0;
}
.sbl-war h4 { margin: 0 0 .5rem; }
.war-line { margin: .3rem 0; font-size: .92rem; }
.war-line strong { display: inline-block; min-width: 88px; color: var(--accent); font-size: .78rem; text-transform: uppercase; letter-spacing: .5px; }
/* ============================================================
   ui-b1.css — Mockups fieles de ventanas SAP Business One.
   Replica el cliente clásico: chrome gris perla, titlebar azul
   corporativa, campos amarillos editables / blancos de sistema,
   tabs de carpeta, grid con footer de totales, barra de estado.
   ============================================================ */

.b1 {
  --b1-chrome: #ece9e2;
  --b1-chrome-dark: #d8d4cb;
  --b1-title: #1a3a6b;
  --b1-yellow: #fdf3c9;
  --b1-yellow-act: #ffe98a;
  --b1-sys: #ffffff;
  --b1-lock: #e6e2d9;
  --b1-ink: #1f1a13;
  --b1-line: #b8b2a6;
  --b1-gridline: #ddd8cd;
  --b1-num: #0d3b66;
  --b1-tab-active: #f6f3ec;
  margin: 0 0 1.1rem;
  border: 1px solid var(--b1-line);
  box-shadow: 2px 2px 0 rgba(31, 26, 19, .12);
  background: var(--b1-chrome);
  font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
  font-size: 12.5px;
  color: var(--b1-ink);
}

.b1-titlebar {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(180deg, #2c4f86, var(--b1-title));
  color: #fff; padding: 4px 8px; font-size: 12px; font-weight: 600;
  letter-spacing: .2px;
}
.b1-ticon { opacity: .85; }
.b1-ttext { flex: 1; }
.b1-tctrl span { margin-left: 8px; opacity: .85; cursor: default; }

.b1-menubar {
  display: flex; gap: 14px; padding: 3px 10px;
  background: var(--b1-chrome); border-bottom: 1px solid var(--b1-line);
  font-size: 11.5px; color: #444;
}
.b1-menubar span:hover { background: var(--b1-chrome-dark); }

.b1-toolbar {
  display: flex; align-items: center; gap: 2px; padding: 4px 8px;
  border-bottom: 1px solid var(--b1-line); background: #f4f1ea;
}
.b1-tbtn {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 20px; padding: 0 4px;
  border: 1px solid transparent; border-radius: 2px; font-size: 11px; line-height: 1;
}
.b1-tbtn:hover { border-color: var(--b1-line); background: #fff; }
.b1-toolbar-sep { width: 1px; height: 16px; background: var(--b1-line); margin: 0 4px; }

.b1-body { padding: 10px 10px 8px; background: var(--b1-chrome); }

.b1-tabs { display: flex; gap: 2px; margin-bottom: 8px; }
.b1-tab {
  padding: 4px 12px; font-size: 11.5px;
  background: var(--b1-chrome-dark); border: 1px solid var(--b1-line); border-bottom: none;
  border-radius: 4px 4px 0 0; color: #555;
}
.b1-tab.is-active { background: var(--b1-tab-active); color: var(--b1-ink); font-weight: 600; position: relative; top: 1px; }

    id, classification: 'synthetic', level,
    prompt: spec.q, options: spec.opts.es.map((_, index) => index), optionsText: spec.opts,
    correct: spec.ok, rationale: spec.why, evidenceId: spec.ev,

// ui-b1.mjs — Renderizador de mockups fieles de ventanas SAP Business One.
// Replica la identidad visual real del cliente B1: chrome gris, barra de título azul clásica,
// campos amarillos para entrada, blancos para sistema, tabs de carpeta, grid con totales.
// Especificación por pantalla (spec): título, tabs, campos de cabecera, columnas, filas, totales.

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = (v, locale) => v?.[locale] ?? v?.en ?? v?.es ?? '';

// Toolbar estándar B1: Añadir, Buscar, Navegar, Cancelar — los cuatro iconos de siempre.
function b1Toolbar() {
  const btn = (glyph, title) => `<span class="b1-tbtn" title="${esc(title)}">${glyph}</span>`;
  return `<div class="b1-toolbar">${btn('💾+', 'Añadir (Ctrl+A)')}${btn('🔍', 'Buscar (Ctrl+F)')}${btn('⏮', 'Primer registro')}${btn('◀', 'Anterior')}${btn('▶', 'Siguiente')}${btn('⏭', 'Último registro')}${btn('✖', 'Cancelar (Ctrl+C)')}<span class="b1-toolbar-sep"></span><span class="b1-tbtn" title="Imprimir">🖨</span></div>`;
}

function b1Tabs(tabs, active) {
  if (!tabs?.length) return '';
  return `<div class="b1-tabs">${tabs.map((tab, i) => `<span class="b1-tab${i === active ? ' is-active' : ''}">${esc(tab)}</span>`).join('')}</div>`;
}

// Campos de cabecera: [etiqueta, valor, tipo] tipo: 'in' amarillo editable · 'sys' blanco sistema · 'lock' gris bloqueado
function b1Header(fields) {
  if (!fields?.length) return '';
  return `<div class="b1-header">${fields.map(([label, value, kind]) =>
    `<label class="b1-field"><span class="b1-flabel">${esc(label)}</span><span class="b1-fvalue b1-${kind || 'in'}">${esc(value)}</span></label>`).join('')}</div>`;
}

function b1Grid(cols, rows, numeric) {
  if (!cols?.length) return '';
  return `<div class="b1-grid" role="table"><div class="b1-grid-head" role="row">${cols.map((c, i) => `<span class="b1-h${numeric?.includes(i) ? ' is-num' : ''}" role="columnheader">${esc(c)}</span>`).join('')}</div>` +
    (rows || []).map(r => `<div class="b1-grid-row" role="row">${r.map((c, i) => `<span class="b1-c${numeric?.includes(i) ? ' is-num' : ''}" role="cell">${esc(c)}</span>`).join('')}</div>`).join('') + `</div>`;
}

function b1Totals(totals) {
  if (!totals?.length) return '';
  return `<div class="b1-totals">${totals.map(([label, value]) =>
    `<div class="b1-total-row"><span>${esc(label)}</span><span class="b1-total-val">${esc(value)}</span></div>`).join('')}</div>`;
}

// Ventana completa SAP B1. spec = { title, menu, tabs, activeTab, header, cols, rows, numeric, totals, status, note }
function b1Window(spec, locale) {
  if (!spec) return '';
  return `<figure class="b1" role="img" aria-label="${esc(pick(spec.title, locale))} — ventana SAP Business One">
<div class="b1-titlebar"><span class="b1-ticon">🪟</span><span class="b1-ttext">${esc(pick(spec.title, locale))}</span><span class="b1-tctrl"><span>_</span><span>▢</span><span>✕</span></span></div>
<div class="b1-menubar">${(spec.menu !== false) ? '<span>Archivo</span><span>Editar</span><span>Ver</span><span>Datos</span><span>Ir a</span><span>Herramientas</span><span>Ayuda</span>' : ''}</div>
${b1Toolbar()}
<div class="b1-body">
${b1Tabs(spec.tabs, spec.activeTab ?? 0)}
${b1Header(spec.header)}
${b1Grid(spec.cols, spec.rows, spec.numeric)}
${b1Totals(spec.totals)}
${spec.status ? `<div class="b1-status">${spec.status.map(esc).join(' · ')}</div>` : ''}
</div>
${spec.note ? `<figcaption>${esc(pick(spec.note, locale))}</figcaption>` : ''}
</figure>`;
}

function text(v, locale) { return v?.[locale] ?? v?.es ?? String(v ?? ''); }
function asArray(v) { return Array.isArray(v) ? v : v ? [v] : []; }
function shuffledDeterministic(items) { return items.map((v,i)=>({v,k:(i*7+3)%items.length})).sort((a,b)=>a.k-b.k).map(x=>x.v); }

function configSpec(skill, mc, locale) {
  const raw = text(asArray(mc.cfg)[0], locale);
  const route = raw.split(':')[0].split('>').map(x=>x.trim()).filter(Boolean);
  const decoys = ['Gestión','Informes','Parametrizaciones generales','Herramientas'];
  return { route, tokens: shuffledDeterministic([...route, ...decoys.filter(x=>!route.includes(x)).slice(0,Math.max(2,5-route.length))]) };
}
function simulatorSpec(skill, mc, locale) {
  const fields = asArray(mc.screen?.fields);
  const editable = fields.filter(f=>f[2]).slice(0,3);
  let targets = editable.length ? editable : fields.slice(0,Math.min(3,fields.length));
  if (!targets.length) targets = asArray(mc.screen?.rows).slice(0,3).map(r => [r[0], r[1] ?? r[0]]);
  return { targets: targets.map((f,i)=>({ label:f[0], expected:f[1], options:shuffledDeterministic([f[1], i===0?'— Vacío —':'Automático', i===0?'Bloqueado':'Manual']) })) };
}
function forensicSpec(skill, mc, locale) {
  const steps = asArray(mc.e2e).map((x,i)=>({ label:text(x,locale), broken:false, index:i }));
  const broken = { label:`⚠ ${text(mc.war?.root,locale)}`, broken:true, index:steps.length };
  return { evidence: shuffledDeterministic([...steps.slice(0,3),broken]), resolution:text(mc.war?.fix,locale) };
}
function bughuntSpec(skill, mc, locale) {
  return { clues: shuffledDeterministic([
    { label:text(mc.war?.root,locale), error:true },
    { label:text(asArray(mc.bp)[0],locale), error:false },
    { label:text(asArray(mc.e2e)[0],locale), error:false },
    { label:text(asArray(mc.cfg)[0],locale), error:false }
  ]), resolution:text(mc.war?.fix,locale) };
}
function consequenceSpec(skill, mc, locale) {
  return { trigger:text(mc.war?.symptom,locale), chain:[
    text(mc.war?.root,locale),
    text(asArray(mc.e2e)[Math.min(1,asArray(mc.e2e).length-1)],locale),
    text(mc.war?.fix,locale)
  ].filter(Boolean) };
}

function getActivity(skill, locale='es') {
  const mc = MASTERCLASS[skill.id];
  const type = activityType(skill.id);
  const base = { type, label:text(LABELS[type],locale), mc };
  if (!mc) return { ...base, unavailable:true };
  if (type==='journal') return { ...base, lines:JOURNALS[skill.id] || [['Cuenta de origen','Debe','1000,00'],['Contrapartida','Haber','1000,00']] };
  if (type==='config') return { ...base, ...configSpec(skill,mc,locale) };
  if (type==='simulator') return { ...base, ...simulatorSpec(skill,mc,locale) };
  if (type==='forensic') return { ...base, ...forensicSpec(skill,mc,locale) };
  if (type==='bughunt') return { ...base, ...bughuntSpec(skill,mc,locale) };
  return { ...base, ...consequenceSpec(skill,mc,locale) };
}

const SCORE_FIELDS = ['knowledge', 'application', 'verification', 'risk'];

function calculateMastery(scores = {}, safetyGatePassed = true) {
  const normalized = Object.fromEntries(SCORE_FIELDS.map(field => [field, Math.max(0, Math.min(100, Number(scores[field]) || 0))]));
  const score = Math.round((normalized.knowledge + normalized.application + normalized.verification + normalized.risk) / 4);
  if (!safetyGatePassed) return { score, mastered: false, reason: 'safety-gate', dimensions: normalized };
  const mastered = normalized.knowledge >= 80 && normalized.application >= 80 && normalized.verification >= 90 && normalized.risk >= 90;
  return { score, mastered, reason: mastered ? 'mastered' : 'threshold', dimensions: normalized };
}

function recommendNext(skills, progress = {}, now = new Date(), options = {}) {
  const time = now instanceof Date ? now.getTime() : new Date(now).getTime();
  const track = ['functional', 'technical', 'dual'].includes(options.track) ? options.track : 'dual';
  const eligible = skills.filter(skill => {
    if (track === 'dual' || !skill.track) return true;
    return skill.track === track || skill.track === 'dual';
  });
  const recommendedLevel = Number(options.recommendedLevel);
  if (Object.keys(progress).length === 0 && Number.isInteger(recommendedLevel) && eligible.length) {
    const atOrAbove = eligible
      .filter(skill => skill.level >= recommendedLevel)
      .sort((a, b) => a.level - b.level || a.id.localeCompare(b.id));
    if (atOrAbove.length) return atOrAbove[0];
    return [...eligible].sort((a, b) => b.level - a.level || a.id.localeCompare(b.id))[0];
  }
  const ranked = eligible.map(skill => {
    const state = progress[skill.id] || {};
    const mastery = Number(state.mastery) || 0;
    const reviewAt = state.nextReview ? new Date(state.nextReview).getTime() : 0;
    const overdue = reviewAt <= time ? 60 : 0;
    const blockedPrerequisites = (skill.prerequisites || []).filter(id => (progress[id]?.mastery || 0) < 80).length;
    const prerequisiteBoost = blockedPrerequisites ? -80 * blockedPrerequisites : 0;
    const score = (100 - mastery) + overdue + (Number(skill.riskWeight) || 1) * 8 + prerequisiteBoost - skill.level * 2;
    return { skill, score };
  });
  ranked.sort((a, b) => b.score - a.score || a.skill.level - b.skill.level || a.skill.id.localeCompare(b.skill.id));
  return ranked[0]?.skill || null;
}

function scanSensitiveInput(value = '') {
  const text = String(value);
  const reasons = [];
  const emails = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi) || [];
  if (emails.some(email => !email.toLowerCase().endsWith('@example.test'))) reasons.push('email-domain');
  const urls = text.match(/https?:\/\/[^\s)]+/gi) || [];
  if (urls.some(rawUrl => {
    try {
      const url = rawUrl.replace(/[.,;!?]+$/, '');
      const host = new URL(url).hostname.toLowerCase();
      return !(host === 'example.test' || host.endsWith('.example.test'));
    } catch {
      return true;
    }
  })) reasons.push('url-domain');
  if (/\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b/i.test(text)) reasons.push('bank-identifier');
  if (/\b(?:\d{1,3}\.){3}\d{1,3}\b/.test(text)) reasons.push('ip-address');
  if (/\b\d{12,}\b/.test(text)) reasons.push('long-identifier');
  return { safe: reasons.length === 0, reasons: [...new Set(reasons)] };
}

const PROMPT_SIGNALS = [
  ['role', /\b(role|rol|rolle)\b/i],
  ['goal', /\b(goal|objective|objetivo|ziel)\b/i],
  ['context', /\b(context|contexto|kontext)\b/i],
  ['evidence', /\b(evidence|evidencia|beleg|quelle)\b/i],
  ['uncertainty', /\b(uncertainty|uncertain|incertidumbre|no verific|unsicher|nicht verifiz)\b/i],
  ['output', /\b(output|salida|ausgabe|json|schema)\b/i],
  ['humanGate', /\b(human gate|human review|revisi[oó]n humana|intervenci[oó]n humana|menschliche pr[uü]fung|freigabe)\b/i]
];

function lintPrompt(value = '') {
  const text = String(value);
  const present = PROMPT_SIGNALS.filter(([, pattern]) => pattern.test(text)).map(([name]) => name);
  const syntheticContext = /\bSYN-[A-Z0-9-]+\b/i.test(text);
  if (syntheticContext) present.push('syntheticContext');
  const required = [...PROMPT_SIGNALS.map(([name]) => name), 'syntheticContext'];
  const missing = required.filter(name => !present.includes(name));
  const privacy = scanSensitiveInput(text);
  const base = Math.round((present.length / required.length) * 100);
  const score = privacy.safe ? base : Math.max(0, base - 30);
  return { score, present, missing, privacy };
}

  if (!value || typeof value !== 'object' || Array.isArray(value)) return { valid: false, reason: 'object-required' };

  if (unknown.length) return { valid: false, reason: 'unknown-fields', fields: unknown };
  if (value.schemaVersion !== 1 || value.classification !== 'synthetic-progress') return { valid: false, reason: 'classification' };

    if (requiredRecord.some(key => !Object.hasOwn(record, key))) return { valid: false, reason: 'progress-required' };
    for (const [key, fieldValue] of Object.entries(record)) {
      if (['mastered', 'explored', 'safetyGatePassed'].includes(key) && typeof fieldValue !== 'boolean') return { valid: false, reason: 'progress-type' };
      if (scoreFields.includes(key) && (typeof fieldValue !== 'number' || !Number.isFinite(fieldValue) || fieldValue < 0 || fieldValue > 100)) return { valid: false, reason: 'progress-range' };

    if (Object.keys(value.settings).some(key => !allowedSettings.includes(key))) return { valid: false, reason: 'settings-fields' };
    if (value.settings.diagnosticCompleted !== undefined && typeof value.settings.diagnosticCompleted !== 'boolean') return { valid: false, reason: 'settings-type' };

function seededOrder(items, seed = 20260822) {

  let state = Number(seed) >>> 0;
  const random = () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
  for (let index = result.length - 1; index > 0; index -= 1) {
    const swap = Math.floor(random() * (index + 1));
    [result[index], result[swap]] = [result[swap], result[index]];
  }
  return result;
}

  const date = new Date(from);
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString();
}

    journal:{es:'Construye el asiento: asigna Debe/Haber e importe. El total debe cuadrar.',en:'Build the journal: assign Debit/Credit and amount. Totals must balance.',de:'Erstelle den Buchungssatz: Soll/Haben und Betrag. Summen müssen stimmen.'},
    forensic:{es:'Sigue la cadena documental y señala exactamente el eslabón roto.',en:'Trace the document chain and identify the exact broken link.',de:'Verfolge die Belegkette und finde das gebrochene Glied.'},
    consequence:{es:'Ordena la cascada real: causa → impacto → respuesta segura.',en:'Order the real cascade: cause → impact → safe response.',de:'Ordne die Kaskade: Ursache → Auswirkung → sichere Reaktion.'},
    config:{es:'Construye la ruta exacta de configuración. Sobran opciones.',en:'Build the exact configuration path. Some options are decoys.',de:'Baue den exakten Konfigurationspfad. Einige Optionen sind Ablenkungen.'}
  };
  return all[type]?.[locale] || all[type]?.es || '';
}

function renderActivityBody(state, activity) {
  const A = state.activityAnswers || {};
  if (activity.type === 'simulator') return `<div class="act-form">${activity.targets.map((f,i)=>`<label><strong>${escapeHtml(f.label)}</strong><select class="form-select" data-activity-input="sim-${i}"><option value="">— Selecciona —</option>${f.options.map(v=>`<option value="${escapeHtml(v)}"${A[`sim-${i}`]===v?' selected':''}>${escapeHtml(v)}</option>`).join('')}</select></label>`).join('')}</div>`;
  if (activity.type === 'bughunt') return `<div class="act-evidence">${activity.clues.map((c,i)=>`<button type="button" class="act-clue${A[`clue-${i}`]?' is-marked':''}" data-action="activity-toggle" data-key="clue-${i}"><span>${A[`clue-${i}`]?'⚑':'○'}</span>${escapeHtml(c.label)}</button>`).join('')}</div>`;
  if (activity.type === 'forensic') return `<div class="act-chain">${activity.evidence.map((e,i)=>`<button type="button" class="act-link${A.broken===String(i)?' is-marked':''}" data-action="activity-answer" data-key="broken" data-value="${i}"><span>${i+1}</span>${escapeHtml(e.label)}</button>`).join('<b>→</b>')}</div>`;
  if (activity.type === 'config') {
    const sequence = state.activitySequence || [];
    return `<div class="act-route-built">${sequence.length?sequence.map(x=>`<span>${escapeHtml(x)}</span>`).join('<b>›</b>'):'<em>La ruta aparece aquí…</em>'}</div><div class="act-token-bank">${activity.tokens.map(x=>`<button type="button" class="btn" data-action="activity-sequence" data-value="${escapeHtml(x)}"${sequence.includes(x)?' disabled':''}>${escapeHtml(x)}</button>`).join('')}</div><button type="button" class="btn btn-small" data-action="activity-undo">↶ Deshacer último</button>`;
  }
  if (activity.type === 'consequence') {
    const sequence = state.activitySequence || [];
    const tokens = [...activity.chain].reverse();
    return `<div class="act-trigger"><strong>Evento observado</strong><p>${escapeHtml(activity.trigger)}</p></div><div class="act-route-built">${sequence.length?sequence.map((x,i)=>`<span><small>${i+1}</small>${escapeHtml(x)}</span>`).join('<b>→</b>'):'<em>Construye la cascada…</em>'}</div><div class="act-token-bank">${tokens.map(x=>`<button type="button" class="btn" data-action="activity-sequence" data-value="${escapeHtml(x)}"${sequence.includes(x)?' disabled':''}>${escapeHtml(x)}</button>`).join('')}</div><button type="button" class="btn btn-small" data-action="activity-undo">↶ Deshacer último</button>`;
  }
  if (activity.type === 'journal') {
    const amount = v => Number(String(v||'0').replace(/\./g,'').replace(',','.')) || 0;
    const debit = activity.lines.reduce((sum,_,i)=>sum+(A[`side-${i}`]==='Debe'?amount(A[`amount-${i}`]):0),0);
    const credit = activity.lines.reduce((sum,_,i)=>sum+(A[`side-${i}`]==='Haber'?amount(A[`amount-${i}`]):0),0);
    const balanced = debit>0 && Math.abs(debit-credit)<.005;
    return `<div class="act-journal"><div class="act-jhead"><span>Cuenta</span><span>Debe / Haber</span><span>Importe</span></div>${activity.lines.map((line,i)=>`<div class="act-jline"><strong>${escapeHtml(line[0])}</strong><select class="form-select" data-activity-input="side-${i}"><option value="">—</option><option${A[`side-${i}`]==='Debe'?' selected':''}>Debe</option><option${A[`side-${i}`]==='Haber'?' selected':''}>Haber</option></select><input class="form-control" inputmode="decimal" data-activity-input="amount-${i}" value="${escapeHtml(A[`amount-${i}`]||'')}" placeholder="0,00"></div>`).join('')}<div class="act-balance${balanced?' is-balanced':''}">Σ Debe <output>${debit.toFixed(2).replace('.',',')}</output> · Σ Haber <output>${credit.toFixed(2).replace('.',',')}</output> · ${balanced?'✓ Cuadrado':'⚠ Diferencia '+Math.abs(debit-credit).toFixed(2).replace('.',',')}</div></div>`;
  }
  return '';
}

function validateActivity(state, skill) {
  const a = getActivity(skill,state.locale), A=state.activityAnswers||{}, seq=state.activitySequence||[];
  let correct=false, message='Revisa la evidencia y vuelve a intentarlo.';
  if(a.type==='simulator') correct=a.targets.every((f,i)=>A[`sim-${i}`]===f.expected);
  if(a.type==='bughunt') correct=a.clues.every((c,i)=>Boolean(A[`clue-${i}`])===Boolean(c.error));
  if(a.type==='forensic') correct=a.evidence[Number(A.broken)]?.broken===true;
  if(a.type==='config') correct=JSON.stringify(seq)===JSON.stringify(a.route);
  if(a.type==='consequence') correct=JSON.stringify(seq)===JSON.stringify(a.chain);
  if(a.type==='journal') correct=a.lines.every((l,i)=>A[`side-${i}`]===l[1] && String(A[`amount-${i}`]||'').replace(/\s/g,'')===l[2]);
  if(correct) message=a.resolution || 'Decisión correcta: la evidencia, el control y el resultado son coherentes.';
  else if(a.type==='journal') message='El asiento no representa correctamente el evento o no cuadra. Comprueba naturaleza de cuenta, lado e importe.';
  else if(a.type==='config') message='La ruta contiene un nivel incorrecto, falta un nivel o el orden no es el del menú real.';
  else if(a.type==='consequence') message='Los hechos son correctos, pero la secuencia causal no. Empieza por la causa raíz, no por la solución.';
  return {correct,message};
}

  return `<div class="sbl-stack">
    <div class="viz-controls">
      <label class="form-label">${t(state, 'level')}<select class="form-select" data-action="level-filter"><option value="all">${t(state, 'allLevels')}</option>${LEVELS.map(level => `<option value="${level.id}"${String(state.levelFilter) === String(level.id) ? ' selected' : ''}>${level.id} · ${local(level.title, state.locale)}</option>`).join('')}</select></label>
      <label class="form-label">${t(state, 'track')}<select class="form-select" data-action="track-filter"><option value="all">${t(state, 'allTracks')}</option><option value="functional"${state.trackFilter === 'functional' ? ' selected' : ''}>${t(state, 'trackFunctional')}</option><option value="technical"${state.trackFilter === 'technical' ? ' selected' : ''}>${t(state, 'trackTechnical')}</option><option value="dual"${state.trackFilter === 'dual' ? ' selected' : ''}>${t(state, 'trackDual')}</option></select></label>
    </div>
    <div class="sbl-levels">${LEVELS.filter(level => filtered.some(skill => skill.level === level.id)).map(level => `<section class="sbl-level-group" aria-labelledby="level-${level.id}"><div class="sbl-level-heading"><h2 id="level-${level.id}">${t(state, 'level')} ${level.id} · ${local(level.title, state.locale)}</h2><span class="text-small">${filtered.filter(skill => skill.level === level.id).length}/8</span></div><div class="viz-grid">${filtered.filter(skill => skill.level === level.id).map(skill => `<button type="button" class="btn viz-tile sbl-node${skill.id === selected.id ? ' is-selected' : ''}" data-action="select-skill" data-skill="${skill.id}" aria-pressed="${skill.id === selected.id}">${local(skill.title, state.locale)}<span class="sbl-node-meta text-small">${skillStatus(state, skill)}</span></button>`).join('')}</div></section>`).join('')}</div>
    ${renderSkillDetail(state, selected)}
  </div>`;
}

function renderSimulator(state) {
  const keys = ['sales', 'purchase', 'finance', 'integration'];
  const labelKeys = { sales: 'processSales', purchase: 'processPurchase', finance: 'processFinance', integration: 'processIntegration' };
  const steps = PROCESS_STEPS[state.process];
  const step = steps[state.processStep] || steps[0];
  const effectRow = (label, value) => `<div class="sbl-effect"><span class="text-small">${label}</span><strong>${local(value, state.locale)}</strong></div>`;
  return `<section class="sbl-stack" aria-labelledby="sim-title"><h2 id="sim-title">${t(state, 'simulatorTitle')}</h2><p class="text-muted">${t(state, 'chainExplorer')}</p><div class="sbl-toolbar">${keys.map(key => `<button type="button" class="btn${state.process === key ? ' btn-primary' : ''}" data-action="select-process" data-process="${key}" aria-pressed="${state.process === key}">${t(state, labelKeys[key])}</button>`).join('')}</div>
  <div class="sbl-process" role="list">${steps.map((item, index) => `<button type="button" class="btn sbl-process-stage" data-action="select-process-step" data-index="${index}" aria-current="${index === state.processStep ? 'step' : 'false'}"><span>${index + 1}. ${local(item.labels, state.locale)}</span><span class="sbl-process-mark" aria-hidden="true"></span></button>`).join('')}</div>
  <div class="card sbl-stack"><strong>${local(step.labels, state.locale)}</strong>
    <div class="sbl-checks">${(step.checks?.[state.locale] || []).map(c => `<span class="viz-badge">${escapeHtml(c)}</span>`).join('')}</div>
    <div class="sbl-effects-grid">
      ${effectRow(t(state, 'effectStock'), step.effects.stock)}
      ${effectRow(t(state, 'effectAccounting'), step.effects.accounting)}
      ${effectRow(t(state, 'effectBalance'), step.effects.balance)}
    </div>
  </div></section>`;
}

function renderAI(state) {
  const result = state.promptResult;
  const defaults = {
    es: 'ROL: mentor de aprendizaje de SAP Business One\nOBJETIVO: Explicar una acción diagnóstica segura para SYN-CASE-AI-01\nCONTEXTO: Solo evidencia sintética\n',
    en: 'ROLE: SAP Business One learning coach\nGOAL: Explain a safe diagnostic action for SYN-CASE-AI-01\nCONTEXT: Synthetic evidence only\n',
    de: 'ROLLE: Lerncoach für SAP Business One\nZIEL: Eine sichere Diagnoseaktion für SYN-CASE-AI-01 erklären\nKONTEXT: Nur synthetische Nachweise\n'
  };
  const fieldKeys = { role: 'promptFieldRole', goal: 'promptFieldGoal', context: 'promptFieldContext', evidence: 'promptFieldEvidence', uncertainty: 'promptFieldUncertainty', output: 'promptFieldOutput', humanGate: 'promptFieldHumanGate', syntheticContext: 'promptFieldSyntheticContext' };
  const defaultPrompt = state.promptDraft || defaults[state.locale];
  const present = Array.isArray(result?.present) ? result.present : [];
  const fieldBar = (isOn, name) => `<span class="sbl-contract-cell${isOn ? ' is-on' : ''}">${t(state, fieldKeys[name] || name)}</span>`;
  return `<section class="sbl-stack" aria-labelledby="ai-title"><h2 id="ai-title">${t(state, 'aiTitle')}</h2><p>${t(state, 'promptHelp')}</p><label class="form-label" for="sbl-prompt">${t(state, 'promptLabel')}</label><textarea id="sbl-prompt" class="form-control" rows="9">${escapeHtml(defaultPrompt)}</textarea><div class="sbl-actions"><button type="button" class="btn btn-primary" data-action="analyze-prompt">${t(state, 'analyze')}</button></div>${result ? `<div class="card sbl-stack"><div class="sbl-card-head"><span class="sbl-score-ring" aria-label="${t(state, 'promptScore')} ${result.score}%">${result.score}%</span><span>${result.privacy.safe ? t(state, 'privacySafe') : t(state, 'privacyBlocked')}</span></div><div class="sbl-contract">${['role', 'goal', 'context', 'evidence', 'uncertainty', 'output', 'humanGate'].map(name => fieldBar(present.includes(name), name)).join('')}${fieldBar(present.includes('syntheticContext'), 'syntheticContext')}</div>${(result.missing || []).length ? `<p><strong>${t(state, 'missing')}:</strong> ${(result.missing || []).map(key => t(state, fieldKeys[key] || key)).join(', ')}</p>` : `<p>${t(state, 'correct')}</p>`}</div>` : ''}</section>`;
}

function renderReview(state) {
  const now = new Date();
  let queue = SKILLS.filter(skill => state.progress[skill.id]?.nextReview && new Date(state.progress[skill.id].nextReview) <= now);
  if (!queue.length) queue = SKILLS.filter(skill => state.progress[skill.id]?.explored && !state.progress[skill.id]?.mastered).slice(0, 5);
  return `<section class="sbl-stack" aria-labelledby="review-title"><h2 id="review-title">${t(state, 'reviewTitle')}</h2>${queue.length ? `<div class="sbl-review-list">${queue.map(skill => `<div class="card sbl-card-head"><div><strong>${local(skill.title, state.locale)}</strong><span class="sbl-node-meta text-small">${skillStatus(state, skill)}</span></div><button type="button" class="btn" data-action="select-skill" data-skill="${skill.id}">${t(state, 'begin')}</button></div>`).join('')}</div>` : `<p>${t(state, 'noReviews')}</p>`}</section>`;
}

function renderEvidence(state) {
  return `<section class="sbl-stack" aria-labelledby="evidence-title"><h2 id="evidence-title">${t(state, 'evidenceTitle')}</h2><div class="table-responsive"><table class="table table-sm"><thead><tr><th>${t(state, 'sourceOfficial')}</th><th>${t(state, 'applicability')}</th><th>${t(state, 'verifiedAt')}</th><th></th></tr></thead><tbody>${EVIDENCE.map(item => `<tr><td>${escapeHtml(item.title)}</td><td>${local(item.applicability, state.locale)}</td><td class="text-nowrap">${escapeHtml(item.verifiedAt)}</td><td><a class="btn" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${t(state, 'openSource')}</a></td></tr>`).join('')}</tbody></table></div></section>`;
}

function renderView(state) {
  switch (state.view) {
    case 'map': return renderMap(state);
    case 'cases': return `<div class="sbl-stack"><h2>${t(state, 'caseLabTitle')}</h2>${renderDecision(state, CASES[state.caseIndex], 'case')}</div>`;
    case 'incidents': return `<div class="sbl-stack"><h2>${t(state, 'incidentTitle')}</h2>${renderDecision(state, INCIDENTS[state.incidentIndex], 'incident')}</div>`;
    case 'simulator': return renderSimulator(state);
    case 'ai': return renderAI(state);
    case 'review': return renderReview(state);
    case 'evidence': return renderEvidence(state);
    default: return renderHome(state);
  }
}

function toastText(state) {
  const map = { 'practice-recorded': 'markPractice', 'import-ok': 'importOk', 'reset-ok': 'resetConfirm', 'import-error': 'importError', 'export-ok': 'exportOk' };
  return state.toast ? `<div class="sbl-toast" role="status">${t(state, map[state.toast] || state.toast)}</div>` : '';
}

function renderAppMarkup(state) {
  return `${renderChrome(state)}<main class="sbl-main">${toastText(state)}${renderView(state)}<div class="sbl-toolbar"><button type="button" class="btn btn-ghost" data-action="export-progress">${t(state, 'export')}</button><label class="form-label sbl-file">${t(state, 'import')}<input class="form-control" type="file" accept="application/json" data-action="import-progress"></label><button type="button" class="btn btn-ghost" data-action="reset-progress">${t(state, 'reset')}</button></div></main></div>`;
}

function loadStored() {
  try {
    const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!value) return createInitialState();
    const validation = validateProgressImport(value);
    if (!validation.valid) return createInitialState();
    return createInitialState({
      locale: value.locale, track: value.track, progress: value.progress,
      diagnosticCompleted: value.settings?.diagnosticCompleted,
      diagnosticScore: value.settings?.diagnosticScore,
      recommendedLevel: value.settings?.recommendedLevel,
      selectedSkillId: value.settings?.selectedSkillId
    });
  } catch { return createInitialState(); }
}

function saveStored(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeProgress(state))); } catch { /* local persistence is optional */ }
}

function downloadProgress(state) {
  const blob = new Blob([JSON.stringify(serializeProgress(state), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = 'sap-b1-mastery-progress-synthetic.json';
  anchor.click();
  URL.revokeObjectURL(url);
}

function mountSapB1Lab(root) {
  if (!root) throw new Error('SAP B1 lab root is required');
  let state = loadStored();
  const render = () => {
    root.innerHTML = renderAppMarkup(state);
    root.setAttribute('lang', state.locale);
    if (globalThis.lucide?.createIcons) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  };
  const dispatch = action => { state = reduceState(state, action); saveStored(state); render(); };

  root.addEventListener('click', event => {
    const control = event.target.closest('[data-action]');
    if (!control || control.disabled) return;
    const action = control.dataset.action;
    if (action === 'nav') dispatch({ type: 'NAVIGATE', view: control.dataset.view });
    else if (action === 'select-skill') dispatch({ type: 'SELECT_SKILL', skillId: control.dataset.skill });
    else if (action === 'set-skill-mode') dispatch({ type: 'SET_SKILL_MODE', mode: control.dataset.mode });
    else if (action === 'activity-toggle') dispatch({ type: 'ACTIVITY_TOGGLE', key: control.dataset.key });
    else if (action === 'activity-answer') dispatch({ type: 'ACTIVITY_ANSWER', key: control.dataset.key, value: control.dataset.value });
    else if (action === 'activity-sequence') dispatch({ type: 'ACTIVITY_SEQUENCE', value: control.dataset.value });
    else if (action === 'activity-undo') dispatch({ type: 'ACTIVITY_SEQUENCE_UNDO' });
    else if (action === 'reset-activity') dispatch({ type: 'RESET_ACTIVITY' });
    else if (action === 'check-activity') {
      const skill = SKILLS.find(s => s.id === state.selectedSkillId);
      const alreadyPassed = state.activityFeedback?.correct === true;
      const result = validateActivity(state, skill);
      dispatch({ type: 'ACTIVITY_FEEDBACK', ...result });
      if (result.correct && !alreadyPassed) dispatch({ type: 'ASSESS_SKILL', skillId: skill.id, correct: true, safetyGatePassed: true, principleCorrect: true });
    }
    else if (action === 'step-decide') dispatch({ type: 'ANSWER_STEP_DECIDE', index: Number(control.dataset.index) });
    else if (action === 'step-principle') dispatch({ type: 'ANSWER_STEP_PRINCIPLE', index: Number(control.dataset.index) });
    else if (action === 'reveal-reasoning') {
      const skillId = state.selectedSkillId;
      const skill = SKILLS.find(s => s.id === skillId);
      dispatch({ type: 'ASSESS_SKILL', skillId, correct: control.dataset.correct === 'true', safetyGatePassed: control.dataset.safety === 'true', principleCorrect: control.dataset.principle === 'true' });
      dispatch({ type: 'REVEAL_REASONING' });
    }
    else if (action === 'answer-diagnostic') dispatch({ type: 'ANSWER_DIAGNOSTIC', correct: control.dataset.correct === 'true' });
    else if (action === 'next-diagnostic') dispatch({ type: 'NEXT_DIAGNOSTIC' });
    else if (action === 'practise-skill') dispatch({ type: 'PRACTISE_SKILL', skillId: control.dataset.skill });
    else if (action === 'assess-skill') dispatch({ type: 'ASSESS_SKILL', skillId: control.dataset.skill, correct: control.dataset.correct === 'true', safetyGatePassed: control.dataset.safety === 'true' });
    else if (action === 'clear-skill-assessment') dispatch({ type: 'CLEAR_SKILL_ASSESSMENT' });
    else if (action === 'answer-decision') dispatch({ type: 'ANSWER_DECISION', kind: control.dataset.kind, correct: control.dataset.correct === 'true', rationale: control.dataset.rationale });
    else if (action === 'next-decision') dispatch({ type: 'NEXT_DECISION', kind: control.dataset.kind });
    else if (action === 'select-boss') dispatch({ type: 'SELECT_BOSS', index: control.dataset.index });
    else if (action === 'select-process') dispatch({ type: 'SELECT_PROCESS', process: control.dataset.process });
    else if (action === 'select-process-step') dispatch({ type: 'SELECT_PROCESS_STEP', index: control.dataset.index });
    else if (action === 'set-level-filter') dispatch({ type: 'SET_LEVEL_FILTER', value: control.dataset.value });
    else if (action === 'analyze-prompt') {
      const prompt = root.querySelector('#sbl-prompt')?.value || '';
      dispatch({ type: 'PROMPT_RESULT', prompt, result: lintPrompt(prompt) });
    } else if (action === 'export-progress') {
      downloadProgress(state); state = { ...state, toast: 'export-ok' }; render();
    } else if (action === 'reset-progress') {
      localStorage.removeItem(STORAGE_KEY); dispatch({ type: 'RESET' });
    }
  });

  root.addEventListener('change', event => {
    const direct = event.target;
    if (direct.dataset.activityInput) { dispatch({ type: 'ACTIVITY_ANSWER', key: direct.dataset.activityInput, value: direct.value }); return; }
    const control = event.target.closest('[data-action]');
    if (!control) return;
    if (control.dataset.action === 'locale') dispatch({ type: 'SET_LOCALE', locale: control.value });
    else if (control.dataset.action === 'track') dispatch({ type: 'SET_TRACK', track: control.value });
    else if (control.dataset.action === 'level-filter') dispatch({ type: 'SET_LEVEL_FILTER', value: control.value });
    else if (control.dataset.action === 'track-filter') dispatch({ type: 'SET_TRACK_FILTER', value: control.value });
    else if (control.dataset.action === 'import-progress' && control.files?.[0]) {
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        try {
          const value = JSON.parse(String(reader.result));
          const validation = validateProgressImport(value);
          if (!validation.valid) throw new Error(validation.reason);
          dispatch({ type: 'IMPORT_STATE', value: {
            locale: value.locale, track: value.track, progress: value.progress,
            diagnosticCompleted: value.settings?.diagnosticCompleted,
            diagnosticScore: value.settings?.diagnosticScore,
            recommendedLevel: value.settings?.recommendedLevel,
            selectedSkillId: value.settings?.selectedSkillId
          } });
        } catch { state = { ...state, toast: 'import-error' }; render(); }
      });
      reader.readAsText(control.files[0]);
    }
  });

  render();
  return { getState: () => structuredClone(state), dispatch };
}

const sapB1LabRoot = document.getElementById('sap-b1-mastery-lab');
mountSapB1Lab(sapB1LabRoot);
})();
</script>
